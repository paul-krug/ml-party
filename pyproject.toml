[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlparty"
version = "0.2.8"
description = "Agent-native ML experiment tracking and lineage/knowledge substrate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.7",
    "dulwich>=0.21",
    "mcp>=1.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "python-ulid>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
embed = ["fastembed>=0.3"]
docs = ["sphinx>=8", "myst-parser>=4", "furo", "sphinx-copybutton"]
dev-media = ["playwright", "imageio-ffmpeg", "numpy"]

[project.urls]
Homepage = "https://github.com/paul-krug/ml-party"
Documentation = "https://paul-krug.github.io/ml-party/"
Issues = "https://github.com/paul-krug/ml-party/issues"
Changelog = "https://github.com/paul-krug/ml-party/blob/main/CHANGELOG.md"

[project.scripts]
mlp = "mlparty.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# _docs ships in the wheel so the `help` MCP tool can serve the real guides to
# agents; the docs site renders these same files through include stubs.
mlparty = ["static/*.js", "ui_dist/*", "ui_dist/assets/*", "_docs/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
