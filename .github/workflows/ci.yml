name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: python -m pytest tests/ -q

  # macOS is a supported platform (POSIX file locking, spawn-based
  # multiprocessing and BSD userland all differ from Linux), so it is
  # tested rather than assumed. Deliberately a SEPARATE job: adding an
  # `os` axis to `test` above would rename its jobs and orphan the
  # required status checks pinned in branch protection.
  test-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: python -m pytest tests/ -q

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui

  # The suite runs against a checkout where ui/dist may not exist, so the
  # packaged-and-served path — the only one a `pip install` user takes — was
  # untested. Build the wheel exactly as release.yml does, install it, and
  # check the SPA and its hashed assets are really served. Both platforms:
  # the wheel is what a macOS user installs.
  ui-serving:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cp -r ui/dist src/mlparty/ui_dist
      - run: pip install build && python -m build --wheel
      - run: pip install dist/*.whl
      - name: serve the bundled SPA and fetch it
        run: python scripts/check_ui_serving.py

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .[docs]
      - run: python -m sphinx -b html docs docs/_build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ml-party-ci .
      - name: smoke test the container
        run: |
          docker run -d --name mlp -p 7327:7327 -e ML_PARTY_TOKEN=ci-smoke-token ml-party-ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7327/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:7327/api/health | grep -q '"ok":true'
          # ingest surface is up and token-gated
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7327/api/ingest/events -H 'Content-Type: application/json' -d '{"events":[]}')" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7327/api/ingest/events -H 'Authorization: Bearer ci-smoke-token' -H 'Content-Type: application/json' -d '{"events":[]}')" = "200"
          # UI is served
          curl -sf http://127.0.0.1:7327/ | grep -qi "<!doctype html>"
          # multi-user auth: the first user flips the server to login-gated reads
          docker exec mlp sh -c "echo ci-password-1 | mlp user add ci-admin --role admin --password - --root /data"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7327/api/nodes)" = "401"
          curl -s -c /tmp/cj -X POST http://127.0.0.1:7327/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"ci-password-1"}' | grep -q ci-admin
          test "$(curl -s -b /tmp/cj -o /dev/null -w '%{http_code}' http://127.0.0.1:7327/api/nodes)" = "200"
          # legacy single token is dead once users exist
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7327/api/ingest/events -H 'Authorization: Bearer ci-smoke-token' -H 'Content-Type: application/json' -d '{"events":[]}')" = "401"
          docker rm -f mlp
